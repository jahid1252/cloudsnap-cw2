<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSnap Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>☁️ CloudSnap Gallery</h1>

        <form id="uploadForm">

            <input 
                type="text" 
                id="title" 
                placeholder="Enter image title" 
                required
            >

            <input 
                type="file" 
                id="image" 
                accept="image/*" 
                required
            >

            <button type="submit">
                Upload Image
            </button>

        </form>

        <div id="gallery"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
